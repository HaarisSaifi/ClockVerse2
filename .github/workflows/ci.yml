name: ClockVerse CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  engine-tests:
    name: Rust Engine Tests (Phase gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
        working-directory: engine
      - name: Clippy (warnings = errors, no exceptions)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: engine
      - name: Unit + carve correctness tests
        run: cargo test --release
        working-directory: engine
      # Phase 1 gate: 1 GB transcript < 8s. Yeh bench job baad mein
      # criterion se wire hoga — abhi placeholder step rakha hai taaki
      # gate ka CI hook pehle din se exist kare.
      - name: Perf gate placeholder (Phase 1)
        run: echo "TODO: criterion bench — chrono_replay_1gb < 8s"

  sidecar-tests:
    name: Python Sidecar Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Sidecar protocol smoke test
        run: |
          echo '{"id":1,"method":"image_info","params":{"path":"sidecar/sidecar.py"}}' \
            | python3 sidecar/sidecar.py | grep -q '"result"' && echo "protocol OK"

  tauri-build:
    name: Tauri Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Build (all targets must compile on every commit)
        run: cargo build --locked
        working-directory: src-tauri
